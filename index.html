<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#8E0C21">
  <title>Futsal Manager</title>
  <link rel="stylesheet" href="css/app.css">
  <!-- SQLite(WebAssembly): 오프라인용으로 저장소에 포함. 전역 initSqlJs 를 만든다 -->
  <script src="vendor/sql.js/sql-wasm.js"></script>
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <header class="topbar">
    <div class="eyebrow" id="team-name">Futsal Manager</div>
    <h1 id="page-title">불러오는 중…</h1>
    <div class="sub" id="page-sub"></div>
  </header>

  <main id="app" aria-live="polite">
    <p class="muted">장부를 여는 중입니다…</p>
  </main>

  <!-- 아래 탭 (장부가 있을 때만) -->
  <nav id="tabbar" class="tabbar" hidden>
    <button data-tab="home" aria-current="page"><span class="ico" aria-hidden="true">⚽</span>홈</button>
    <button data-tab="backup"><span class="ico" aria-hidden="true">💾</span>백업</button>
  </nav>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <!-- 장부 파일 불러오기 (화면에 보이지 않는 파일 선택 상자, 버튼으로 연다) -->
  <input type="file" id="file-input" accept=".db,application/octet-stream,application/x-sqlite3" hidden>

  <!-- 불러오기 확인 창 -->
  <dialog id="import-dialog">
    <form method="dialog" class="sheet">
      <h2>이 파일로 장부를 바꿀까요?</h2>
      <div id="import-summary" class="summary"></div>
      <div id="import-freshness" class="notice"></div>
      <label class="check"><input type="checkbox" id="confirm-1"> 지금 휴대폰의 장부를 이 파일로 바꿉니다. (지금 장부는 안전 백업으로 1개 보관)</label>
      <label class="check" id="confirm-2-row" hidden><input type="checkbox" id="confirm-2"> 오래된 파일(또는 수정 시각을 알 수 없는 파일)인 것을 알고 덮어씁니다.</label>
      <div class="actions">
        <button value="cancel" class="btn">취소</button>
        <button value="ok" id="import-ok" class="btn primary" disabled>불러오기</button>
      </div>
    </form>
  </dialog>
</body>
</html>
